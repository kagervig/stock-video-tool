[project]
name = "stock-video-tool"
version = "0.1.0"
description = "Desktop tool to describe, tag, convert and export stock video clips"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
stock-video-tool = "stock_video_tool.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
